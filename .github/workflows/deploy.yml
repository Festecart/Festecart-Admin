name: Build & Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        if: secrets.FIREBASE_TOKEN != ''
        run: |
          npx firebase deploy --only hosting --token "$FIREBASE_TOKEN"

      - name: Skip deploy when Firebase token is missing
        if: secrets.FIREBASE_TOKEN == ''
        run: |
          echo "FIREBASE_TOKEN is not configured. Deployment skipped."
          echo "Add a repository secret named FIREBASE_TOKEN and push again."
