name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate FTP deploy secrets
        run: |
          missing=false
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then echo "Missing secret: FTP_SERVER"; missing=true; fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then echo "Missing secret: FTP_USERNAME"; missing=true; fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then echo "Missing secret: FTP_PASSWORD"; missing=true; fi
          if [ -z "${{ secrets.FTP_SERVER_DIR }}" ]; then echo "Missing secret: FTP_SERVER_DIR"; missing=true; fi
          if [ "$missing" = true ]; then exit 1; fi

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ${{ secrets.FTP_SERVER }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          local-dir:   ./dist/
          server-dir:  ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
